{% set name = "torchsurv" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 564445364b79e8911d6c8aa46d30c94e1c2c4c0230d42fb1e993edbbb48f4729

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.9
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=3.9
    - pytorch
    - scipy
    - numpy
    - torchmetrics

test:
  imports:
    - torchsurv
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://opensource.nibr.com/torchsurv
  summary: Deep survival analysis made easy with pytorch
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pkrusche
    - kruscpe1
    - tcoroller
